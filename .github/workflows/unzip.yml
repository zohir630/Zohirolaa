name: Unzip Project
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete old files and unzip new
        run: |
          set -e
          ZIP=$(ls -t *.zip 2>/dev/null | head -n1)
          if [ -z "$ZIP" ]; then echo "রিপোর মূল ফোল্ডারে কোনো .zip ফাইল নেই। আগে ZIP আপলোড করুন।"; exit 1; fi
          echo "Unzipping: $ZIP"
          mkdir -p /tmp/x
          unzip -q -o "$ZIP" -d /tmp/x
          TOP=$(ls -A /tmp/x | head -n1)
          if [ "$(ls -A /tmp/x | wc -l)" = "1" ] && [ -d "/tmp/x/$TOP" ]; then SRC="/tmp/x/$TOP"; else SRC=/tmp/x; fi
          rm -rf "$SRC/.github"
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a "$SRC"/. .
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Replace with new project" || echo "nothing to commit"
          git push
